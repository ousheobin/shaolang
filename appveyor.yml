shallow_clone: true

image: Visual Studio 2022

platform:
- x86
- x64

configuration:
- Debug
- Release

install:
- ps: cmake --version

before_build:
- ps: |
    mkdir build
    cd build
    if ($env:PLATFORM -eq "x64") {
        $arch = "x64"
    } else {
        $arch = "Win32"
    }
    echo generatorArchitecture=$arch
    cmake .. -G "Visual Studio 17 2022" -A $arch

build_script:
- cmd: cmake --build build --config %CONFIGURATION% -- /m /v:minimal

deploy: off
