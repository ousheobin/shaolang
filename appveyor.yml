shallow_clone: true

image: Visual Studio 2022

platform:
- x86
- x64

configuration:
- Debug
- Release

# Windows is the only host that can assemble, link and run the two COFF targets, so the end-to-end
# suite lives here and GitHub Actions covers macOS and Linux. Everything is Microsoft's own
# toolchain: MSVC builds the compiler, ml.exe / ml64.exe assemble the MASM output and link.exe links
# it against msvcrt.lib. The compiler's word size decides the host triple, so the x86 job needs the
# 32-bit assembler and the x64 job the 64-bit one. bash is only a script interpreter here, and the
# cases run once, in Release; the Debug jobs only prove MSVC can build the compiler.
install:
- ps: |
    cmake --version
    $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
    $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
    if (-not $vs) { throw "No Visual Studio C++ toolchain on this image." }
    # The module sits under Common7\Tools, not the installation root
    $devShell = Join-Path $vs "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
    if (-not (Test-Path $devShell)) { throw "Cannot find $devShell" }
    Import-Module $devShell
    $arch = if ($env:PLATFORM -eq "x64") { "amd64" } else { "x86" }
    # ml.exe / ml64.exe and link.exe are only on PATH after the developer environment is loaded
    Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -no_logo" | Out-Null
    $assembler = if ($arch -eq "amd64") { "ml64.exe" } else { "ml.exe" }
    foreach ($tool in @($assembler, "link.exe")) {
        if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "$tool is not on PATH." }
    }

before_build:
- ps: |
    if ($env:PLATFORM -eq "x64") {
        $arch = "x64"
    } else {
        $arch = "Win32"
    }
    echo generatorArchitecture=$arch
    cmake -S . -B build -G "Visual Studio 17 2022" -A $arch

build_script:
- ps: cmake --build build --config $env:CONFIGURATION -- /m /v:minimal

after_build:
- ps: |
    if ($env:CONFIGURATION -ne "Release") {
        echo "End-to-end skipped in $env:CONFIGURATION: it runs once, in Release."
        return
    }
    [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
    # run.sh reuses the compiler it is handed through SHAOLANG instead of rebuilding with CXX.
    $exe = Join-Path $env:APPVEYOR_BUILD_FOLDER "build\$env:CONFIGURATION\shaolang.exe"
    if (-not (Test-Path $exe)) { throw "Cannot find $exe" }
    # The path has to be the POSIX form because it is bash that execs the compiler.
    $env:SHAOLANG = & C:\msys64\usr\bin\cygpath.exe -u $exe
    if (-not $env:SHAOLANG) { throw "cygpath returned nothing for $exe" }
    echo "Running the end-to-end suite with $env:SHAOLANG"
    # Pass the script as an argument rather than through bash -c: PowerShell rebuilds an
    # embedded quoted -c string without escaping the inner quotes, and the assignment reaches
    # bash already broken.
    & C:\msys64\usr\bin\bash.exe test/e2e/run.sh
    if ($LASTEXITCODE -ne 0) { throw "End-to-end suite failed" }

deploy: off
