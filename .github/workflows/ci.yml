name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"

      - name: Build
        run: cmake --build build --config "${{ matrix.build_type }}" --parallel

  # Every host compiles and runs the cases for its own target triple, so this job needs a host
  # whose architecture the back end supports: arm64 gives linux-arm64, x86_64 gives linux-x64.
  # CC is clang only for the cross-assembly rounds; linking always goes through the host cc.
  # The two Windows triples cannot be linked here, so they live in appveyor.yml instead.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    env:
      SHAOLANG: ${{ github.workspace }}/build/shaolang
      CC: clang

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          "${CXX:-c++}" --version | head -1
          clang --version | head -1 || echo "no clang, cross-assembly rounds will skip"

      - name: Build compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run end-to-end tests
        run: test/e2e/run.sh
