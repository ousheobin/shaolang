name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"

      - name: Build
        run: cmake --build build --config "${{ matrix.build_type }}" --parallel

  # The back end emits aarch64 code and the cases must actually run, so this job only works on arm64 hosts.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    env:
      SHAOLANG: ${{ github.workspace }}/build/shaolang

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          "${CXX:-c++}" --version | head -1

      - name: Build compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run end-to-end tests
        run: test/e2e/run.sh
